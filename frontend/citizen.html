<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>住民ウォレット — JPN PBM</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div id="nav"></div>
<header><h1>住民ウォレット</h1><p>マイナンバーカード認証 → PBM 受領 → 購入</p></header>
<main>
<section>
  <h2>① マイナンバーカード認証 (4 情報)</h2>
  <form id="loginForm">
    <div class="row">
      <label>マイナンバー (擬似)<input name="maina_id" value="MN-0001"></label>
      <label>氏名<input name="name" value="山田 太郎"></label>
    </div>
    <label>住所<input name="address" value="東京都新宿区西新宿2-8-1"></label>
    <div class="row">
      <label>区市町村<input name="ward" value="新宿区"></label>
      <label>生年月日<input name="dob" type="date" value="1955-03-12"></label>
      <label>性別
        <select name="gender">
          <option>M</option><option>F</option><option>X</option>
        </select>
      </label>
    </div>
    <button type="submit">マイナンバー認証</button>
    <small>※ MVP モック。本番は JPKI 公的個人認証で署名検証。</small>
  </form>
  <div id="me"></div>
</section>

<section>
  <h2>② 受給可能な助成金プログラム</h2>
  <div id="eligible"></div>
</section>

<section>
  <h2>③ ウォレット残高</h2>
  <div id="walletKpi" class="kpi-grid"></div>
  <h3>保有 PBM トークン</h3>
  <div id="pbmList"></div>
</section>
</main>
<script src="/ui/api.js"></script>
<script>
let pid = null;

document.getElementById('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const r = await api('/auth/myna/login', { method: 'POST', body: JSON.stringify({
    maina_id: fd.get('maina_id'),
    name: fd.get('name'),
    address: fd.get('address'),
    ward: fd.get('ward'),
    dob: fd.get('dob'),
    gender: fd.get('gender'),
  })});
  pid = r.pid;
  document.getElementById('me').innerHTML =
    `<p>認証 OK / 擬似ID (HMAC): <code>${pid.slice(0,16)}…</code></p>`;
  await refreshAll();
});

async function refreshAll() {
  if (!pid) return;
  // 受給可能プログラム
  const eligible = await api('/programs/eligible/' + pid);
  const root = document.getElementById('eligible');
  root.innerHTML = '';
  if (!eligible.length) {
    root.innerHTML = '<p>(現在受給可能なプログラムはありません)</p>';
  } else {
    for (const p of eligible) {
      root.appendChild(el('div', { class: 'card' },
        el('h3', {}, p.name),
        el('p', {}, p.description),
        el('p', {}, `助成率 ${(p.subsidy_bps/100).toFixed(0)}% / 上限 ${fmtJpy(p.per_citizen_cap_jpy)} / 残予算 ${fmtJpy(p.budget_jpy - p.spent_jpy)}`),
        el('button', { onclick: async () => {
          try {
            const r = await api(`/programs/${p.id}/issue`, {
              method: 'POST', body: JSON.stringify({ citizen_pid: pid })
            });
            alert('PBM 発行 OK: ' + r.pbm_id + ' / 枠 ' + fmtJpy(r.remaining_jpy));
            refreshAll();
          } catch (e) { alert(e.message); }
        }}, 'PBM を申請する')
      ));
    }
  }
  // 残高
  const w = await api('/wallet/citizen/' + pid);
  document.getElementById('walletKpi').innerHTML = '';
  document.getElementById('walletKpi').appendChild(
    el('div', { class: 'kpi' },
      el('div', { class: 'label' }, '通常 JPYC 残高'),
      el('div', { class: 'value' }, fmtJpy(w.jpyc_balance))
    )
  );
  document.getElementById('walletKpi').appendChild(
    el('div', { class: 'kpi' },
      el('div', { class: 'label' }, '保有 PBM トークン数'),
      el('div', { class: 'value' }, w.pbm_tokens.length)
    )
  );
  const pbmRoot = document.getElementById('pbmList');
  pbmRoot.innerHTML = '';
  if (!w.pbm_tokens.length) { pbmRoot.textContent = '(なし)'; }
  else {
    const tbl = el('table', {},
      el('thead', {}, el('tr', {},
        el('th', {}, 'PBM ID'), el('th', {}, 'プログラム'), el('th', {}, '残枠'), el('th', {}, '失効日')
      )),
      el('tbody', {})
    );
    for (const t of w.pbm_tokens) {
      tbl.querySelector('tbody').appendChild(el('tr', {},
        el('td', {}, t.id.slice(0,8)),
        el('td', {}, t.program_id),
        el('td', {}, fmtJpy(t.remaining_jpy)),
        el('td', {}, t.expires_at.slice(0,10))
      ));
    }
    pbmRoot.appendChild(tbl);
  }
}
</script>
</body>
</html>
