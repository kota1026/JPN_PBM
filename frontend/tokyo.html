<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京都管理 — JPN PBM</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div id="chrome"></div>
<main>

<section>
  <h2>トレジャリー (助成金原資)</h2>
  <div class="row">
    <div class="kpi" style="flex:0 0 280px">
      <div class="label">JPYC 残高 (ロック前)</div>
      <div class="value" id="treasuryValue">-</div>
      <div class="sub">プログラム作成時にここから予算分がロックされます</div>
    </div>
    <form id="topupForm" class="row" style="flex:1">
      <label>追加入金額 (JPYC)
        <input type="number" name="amount" placeholder="例: 1000000" min="1" required>
      </label>
      <button type="submit">トレジャリーに入金</button>
    </form>
  </div>
</section>

<section>
  <h2>助成金プログラム</h2>
  <div class="toolbar">
    <span class="note grow">予算 / 消化額 / 助成率 / 期間 / eligibility 条件を一覧表示</span>
  </div>
  <div id="programList" class="empty">読み込み中…</div>
</section>

<section>
  <h2>新規プログラム作成</h2>
  <form id="newForm">
    <div class="row">
      <label>プログラム ID (空欄で自動採番)
        <input name="id" placeholder="prog-xxx">
      </label>
      <label>名称 *
        <input name="name" placeholder="例: 省エネ家電購入支援 2026" required>
      </label>
    </div>
    <label>説明
      <textarea name="description" placeholder="政策意図や対象者の説明"></textarea>
    </label>
    <div class="row">
      <label>予算 (JPYC) *
        <input name="budget_jpy" type="number" min="1" placeholder="50000000" required>
      </label>
      <label>助成率 bps (3000 = 30%) *
        <input name="subsidy_bps" type="number" value="3000" min="1" max="10000" required>
      </label>
      <label>住民 1 人上限 (JPYC) *
        <input name="per_citizen_cap_jpy" type="number" min="1" value="50000" required>
      </label>
    </div>
    <div class="row">
      <label>開始日時 *
        <input name="start_at" type="datetime-local" required>
      </label>
      <label>終了日時 *
        <input name="end_at" type="datetime-local" required>
      </label>
    </div>
    <label>対象 JAN コード (カンマ区切り)
      <input name="eligible_jans" placeholder="4901234567890,4901234567891">
    </label>
    <label>認定加盟店 ID (カンマ区切り)
      <input name="approved_stores" placeholder="store-bic-shinjuku,store-yodobashi-aki">
    </label>
    <label>対象居住区 (カンマ区切り)
      <input name="wards" placeholder="新宿区,渋谷区,世田谷区">
    </label>
    <div class="row">
      <label>最低年齢 (任意)
        <input name="min_age" type="number" min="0" max="120">
      </label>
      <label>上限年齢 (任意)
        <input name="max_age" type="number" min="0" max="120">
      </label>
    </div>
    <div class="toolbar">
      <button type="submit">プログラムを作成して予算ロック</button>
      <span class="note">作成と同時にトレジャリーから予算分の JPYC がロックされます</span>
    </div>
    <div id="newError"></div>
  </form>
</section>

<section>
  <h2>住民への PBM 発行 (運用デモ)</h2>
  <p class="note" style="margin-top:-8px">通常は住民マイページから申請されますが、自治体システム側からの一括発行用エンドポイントを動作確認できます。</p>
  <form id="issueForm" class="row">
    <label>プログラム ID
      <input name="program_id" required placeholder="prog-eco-2026">
    </label>
    <label>住民 PID (HMAC)
      <input name="citizen_pid" required placeholder="badf24…">
    </label>
    <button type="submit">発行</button>
  </form>
  <div id="issueResult"></div>
</section>

</main>

<script src="/ui/api.js"></script>
<script>
async function refreshTreasury() {
  const r = await api('/wallet/treasury');
  document.getElementById('treasuryValue').textContent = fmtJpy(r.jpyc_balance);
}

async function refreshPrograms() {
  const list = await api('/programs');
  const root = document.getElementById('programList');
  root.innerHTML = '';
  if (!list.length) {
    root.className = 'empty';
    root.textContent = 'まだ登録されていません。下のフォームから作成してください。';
    return;
  }
  root.className = '';
  for (const p of list) {
    const used = p.spent_jpy / p.budget_jpy;
    const card = el('div', { class: 'prog-card' });

    const main = el('div', {},
      el('div', { style: 'display:flex; gap:8px; align-items:center;' },
        el('h3', {}, p.name),
        p.revoked ? el('span', { class: 'badge red' }, '取消済') : el('span', { class: 'badge' }, '有効'),
        el('span', { class: 'badge gray' }, p.id)
      ),
      el('p', { class: 'desc' }, p.description || ''),
      el('div', { class: 'meta' },
        el('span', {}, '助成率 ', el('b', {}, (p.subsidy_bps/100).toFixed(1) + '%')),
        el('span', {}, '上限 ', el('b', {}, fmtJpy(p.per_citizen_cap_jpy))),
        el('span', {}, '期間 ' + p.start_at.slice(0,10) + ' – ' + p.end_at.slice(0,10)),
        el('span', {}, '対象 JAN ', el('b', {}, (p.eligible_jans||[]).length + ' 件')),
        el('span', {}, '認定店舗 ', el('b', {}, (p.approved_stores||[]).length + ' 件'))
      ),
      el('div', { style: 'margin-top:10px' },
        el('div', { class: 'bar-track', style: 'max-width:360px' },
          el('div', { class: 'bar', style: `width:${Math.max(2, used*100).toFixed(1)}%` })
        ),
        el('div', { class: 'note' }, `予算 ${fmtJpy(p.budget_jpy)} / 消化 ${fmtJpy(p.spent_jpy)} (${(used*100).toFixed(2)}%)`)
      )
    );

    const ops = el('div', {},
      p.revoked ? null :
        el('button', { class: 'danger', onclick: async () => {
          if (!confirm('このプログラムを取消しますか? 残予算はトレジャリーへ返却されます。')) return;
          const r = await api(`/programs/${p.id}`, { method: 'DELETE' });
          alert('取消完了 / 返却額 ' + fmtJpy(r.refund_jpy));
          refreshAll();
        }}, '取消')
    );

    card.appendChild(main);
    card.appendChild(ops);
    root.appendChild(card);
  }
}

document.getElementById('topupForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  await api('/wallet/treasury/topup', { method: 'POST', body: JSON.stringify({ amount_jpy: Number(fd.get('amount')) }) });
  ev.target.reset();
  refreshTreasury();
});

document.getElementById('newForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const errBox = document.getElementById('newError');
  errBox.innerHTML = '';
  const fd = new FormData(ev.target);
  const eligibility = {};
  const wards = (fd.get('wards') || '').toString().split(',').map(s => s.trim()).filter(Boolean);
  if (wards.length) eligibility.wards = wards;
  if (fd.get('min_age')) eligibility.min_age = Number(fd.get('min_age'));
  if (fd.get('max_age')) eligibility.max_age = Number(fd.get('max_age'));
  const body = {
    id: fd.get('id') || null,
    name: fd.get('name'),
    description: fd.get('description') || '',
    budget_jpy: Number(fd.get('budget_jpy')),
    subsidy_bps: Number(fd.get('subsidy_bps')),
    per_citizen_cap_jpy: Number(fd.get('per_citizen_cap_jpy')),
    start_at: fd.get('start_at'),
    end_at: fd.get('end_at'),
    eligibility,
    eligible_jans: (fd.get('eligible_jans') || '').toString().split(',').map(s => s.trim()).filter(Boolean),
    approved_stores: (fd.get('approved_stores') || '').toString().split(',').map(s => s.trim()).filter(Boolean),
  };
  try {
    await api('/programs', { method: 'POST', body: JSON.stringify(body) });
    ev.target.reset();
    refreshAll();
  } catch (e) {
    errBox.appendChild(el('div', { class: 'error' }, e.message));
  }
});

document.getElementById('issueForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const out = document.getElementById('issueResult');
  out.innerHTML = '';
  try {
    const r = await api(`/programs/${fd.get('program_id')}/issue`, {
      method: 'POST',
      body: JSON.stringify({ citizen_pid: fd.get('citizen_pid') })
    });
    out.appendChild(el('div', { class: 'receipt' },
      el('h3', {}, '発行完了'),
      el('div', {}, `PBM ID: `, el('code', {}, r.pbm_id)),
      el('div', {}, `枠: ${fmtJpy(r.remaining_jpy)} / 失効: ${r.expires_at.slice(0,10)}`)
    ));
  } catch (e) {
    out.appendChild(el('div', { class: 'error' }, e.message));
  }
});

function refreshAll() { refreshTreasury(); refreshPrograms(); }
refreshAll();
</script>
</body>
</html>
