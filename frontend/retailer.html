<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加盟店レジ — JPN PBM</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div id="chrome"></div>
<main>

<section>
  <h2>レジ操作</h2>
  <p class="note" style="margin-top:-6px">
    「住民スキャン」で会員 QR を、「商品スキャン」で JAN バーコードを読み取ると、
    対象プログラムの PBM が自動適用されて即時清算されます。手入力は不要です。
  </p>

  <div class="row">
    <label>加盟店
      <select name="store_id" id="storeSel"></select>
    </label>
    <label>住民 PID
      <input name="citizen_pid" id="pidInput" placeholder="QR をスキャン (HMAC pid)">
    </label>
  </div>

  <div class="row">
    <button type="button" id="scanCustomerBtn" class="secondary">📷 住民 QR をスキャン</button>
    <button type="button" id="scanProductBtn">📷 商品バーコードをスキャン (自動決済)</button>
  </div>

  <div class="row" style="margin-top:8px">
    <label>JAN コード (手入力フォールバック)
      <input name="jan" id="janInput" placeholder="13 桁">
    </label>
    <label style="flex:0 0 100px">数量
      <input name="qty" id="qtyInput" type="number" value="1" min="1">
    </label>
    <button type="button" id="manualPayBtn" class="ghost">手入力で決済</button>
  </div>

  <div id="productInfo"></div>
  <div id="result"></div>
</section>

<section>
  <h2>加盟店 JPYC 残高</h2>
  <div class="kpi-grid">
    <div class="kpi yellow">
      <div class="label">受領 JPYC 残高</div>
      <div class="value" id="storeBalance">-</div>
      <div class="sub">PBM の助成分も自己負担分も区別せず JPYC で着金します</div>
    </div>
  </div>
</section>

<section>
  <h2>商品マスタ (JAN 早見表)</h2>
  <p class="note" style="margin-top:-6px">テスト用の一覧です。バーコードをスキャンできない環境では「使う」で JAN を入力欄にコピーできます。</p>
  <div id="productList" class="empty">読み込み中…</div>
</section>

</main>

<script type="module">
import { scanOnce } from '/ui/scanner.js';
window.__scanOnce = scanOnce;
</script>
<script src="/ui/api.js"></script>
<script>
async function loadStores() {
  const stores = await api('/stores');
  const sel = document.getElementById('storeSel');
  sel.innerHTML = '';
  for (const s of stores) sel.appendChild(el('option', { value: s.id }, `${s.name} (${s.ward})`));
  if (stores.length) refreshStoreBalance(stores[0].id);
  sel.addEventListener('change', () => refreshStoreBalance(sel.value));
}
async function refreshStoreBalance(id) {
  const r = await api('/wallet/store/' + id);
  document.getElementById('storeBalance').textContent = fmtJpy(r.jpyc_balance);
}
async function loadProducts() {
  const ps = await api('/products');
  const root = document.getElementById('productList');
  root.innerHTML = '';
  root.className = '';
  const tbl = el('table', {},
    el('thead', {}, el('tr', {},
      el('th', {}, 'JAN'),
      el('th', {}, '商品名'),
      el('th', {}, 'カテゴリ'),
      el('th', { class: 'num' }, '価格'),
      el('th', {}, '操作')
    )),
    el('tbody', {})
  );
  for (const p of ps) {
    tbl.querySelector('tbody').appendChild(el('tr', {},
      el('td', {}, el('code', {}, p.jan)),
      el('td', {}, p.name),
      el('td', {}, el('span', { class: 'badge gray' }, p.category)),
      el('td', { class: 'num' }, fmtJpy(p.price_jpy)),
      el('td', {}, el('button', {
        class: 'ghost', style: 'padding:4px 10px; font-size:11px',
        onclick: () => {
          document.getElementById('janInput').value = p.jan;
          showProductInfo(p);
        }
      }, '使う'))
    ));
  }
  root.appendChild(tbl);
}
function showProductInfo(p) {
  const root = document.getElementById('productInfo');
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'receipt' },
    el('h3', {}, p.name),
    el('div', {}, p.category + ' / 単価 ' + fmtJpy(p.price_jpy))
  ));
}

async function executePurchase(jan, qty) {
  const pid = document.getElementById('pidInput').value;
  const storeId = document.getElementById('storeSel').value;
  const out = document.getElementById('result');
  out.innerHTML = '';
  if (!pid) {
    out.appendChild(el('div', { class: 'error' }, '住民 PID が未入力です。先に住民 QR をスキャンしてください。'));
    return;
  }
  try {
    const r = await api('/purchase', { method: 'POST', body: JSON.stringify({
      citizen_pid: pid,
      store_id: storeId,
      jan: jan,
      qty: Number(qty),
    })});
    const subsidyPct = r.total_jpy ? (100 * r.subsidy_jpy / r.total_jpy).toFixed(1) : '0';
    const isSubsidized = r.subsidy_jpy > 0;
    out.appendChild(el('div', { class: 'receipt' },
      el('h3', {}, isSubsidized ? '決済完了 (PBM 助成適用)' : '決済完了 (通常 JPYC / 助成対象外)'),
      el('div', { class: 'kpi-grid', style: 'margin-top:10px' },
        el('div', { class: 'kpi' },
          el('div', { class: 'label' }, '合計'),
          el('div', { class: 'value' }, fmtJpy(r.total_jpy))
        ),
        el('div', { class: 'kpi navy' },
          el('div', { class: 'label' }, '助成金 (PBM)'),
          el('div', { class: 'value' }, fmtJpy(r.subsidy_jpy))
        ),
        el('div', { class: 'kpi yellow' },
          el('div', { class: 'label' }, '自己負担 (JPYC)'),
          el('div', { class: 'value' }, fmtJpy(r.citizen_pay_jpy))
        ),
        el('div', { class: 'kpi red' },
          el('div', { class: 'label' }, '助成率'),
          el('div', { class: 'value' }, subsidyPct + '%')
        )
      )
    ));
    refreshStoreBalance(storeId);
  } catch (e) {
    out.appendChild(el('div', { class: 'error' }, e.message));
  }
}

document.getElementById('scanCustomerBtn').addEventListener('click', async () => {
  try {
    const { text } = await window.__scanOnce({
      title: '住民 QR をスキャン',
      formatHint: '会員アプリの QR コードを読み取ります',
      filter: (t, f) => f === 'qr_code' || f === 'manual' || /^[0-9a-f]{32,}$/i.test(t),
    });
    document.getElementById('pidInput').value = text;
    flash('住民 PID 取得 OK');
  } catch { /* cancelled */ }
});

document.getElementById('scanProductBtn').addEventListener('click', async () => {
  try {
    const { text } = await window.__scanOnce({
      title: '商品バーコードをスキャン',
      formatHint: 'JAN / EAN-13 / Code128 を読み取ります',
      filter: (t, f) => f !== 'qr_code',
    });
    document.getElementById('janInput').value = text;
    try {
      const p = await api('/products/' + text);
      showProductInfo(p);
      // 自動決済
      await executePurchase(text, document.getElementById('qtyInput').value || 1);
    } catch (e) {
      document.getElementById('productInfo').innerHTML = '';
      document.getElementById('productInfo').appendChild(el('div', { class: 'error' }, '商品マスタに JAN ' + text + ' がありません'));
    }
  } catch { /* cancelled */ }
});

document.getElementById('manualPayBtn').addEventListener('click', () => {
  const jan = document.getElementById('janInput').value;
  if (!jan) return alert('JAN を入力してください');
  executePurchase(jan, document.getElementById('qtyInput').value || 1);
});

function flash(msg) {
  const out = document.getElementById('result');
  out.innerHTML = '';
  const div = el('div', { class: 'badge', style: 'padding:6px 12px; font-size:12px' }, msg);
  out.appendChild(div);
  setTimeout(() => { if (out.contains(div)) div.remove(); }, 1500);
}

loadStores();
loadProducts();
</script>
</body>
</html>
